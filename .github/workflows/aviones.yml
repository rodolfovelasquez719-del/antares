name: aviones
# Cada ~10 min guarda los aviones públicos sobre Centroamérica en la rama "datos" (un solo commit, se reemplaza: sin historial que crezca).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: aviones, cancel-in-progress: true }
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p /tmp/d && cd /tmp/d && node $GITHUB_WORKSPACE/scripts/aviones.mjs
      - name: publicar en rama datos (forzado, 1 commit)
        run: |
          cd /tmp/d && git init -q -b datos && git config user.name antares-bot && git config user.email bot@users.noreply.github.com
          git add aviones.json && git commit -qm "aviones $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
