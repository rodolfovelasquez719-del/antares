<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Antares</title>
  <meta name="description" content="Antares, tu asistente personal con Gemini.">
  <meta name="theme-color" content="#16161a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antares">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ===== Chat ===== -->
    <section id="chat-view" class="view" aria-label="Chat">
      <header class="topbar">
        <div class="avatar" id="avatar" aria-hidden="true">A</div>
        <div class="titles">
          <h1 id="assistant-title">Antares</h1>
          <p class="subtitle" id="status-line">Asistente personal</p>
        </div>
        <button class="icon-btn" id="open-settings" aria-label="Configuración">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03Z"/></svg>
        </button>
      </header>

      <main id="messages" class="messages" aria-live="polite"></main>

      <form id="composer" class="composer" autocomplete="off">
        <div class="pill">
          <textarea id="msg-input" rows="1" placeholder="Escribile a Antares..." enterkeyhint="send" aria-label="Mensaje"></textarea>
          <button type="button" class="icon-btn mic" id="mic-btn" aria-label="Hablar" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>

    <!-- ===== Configuración ===== -->
    <section id="settings-view" class="view settings" aria-label="Configuración" hidden>
      <header class="topbar">
        <button class="icon-btn" id="close-settings" aria-label="Volver">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="titles"><h1>Configuración</h1></div>
      </header>

      <div class="settings-body">
        <label class="field-label" for="api-key">API key de Gemini (Google AI Studio)</label>
        <p class="hint">Conseguila gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Se guarda solo en este navegador.</p>
        <input id="api-key" class="field" type="text" placeholder="Pegá acá tu API key de Gemini"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="row">
          <button type="button" class="pill-btn" id="toggle-key">Ocultar</button>
          <button type="button" class="pill-btn" id="paste-key">Pegar</button>
          <button type="button" class="pill-btn" id="clear-key">Borrar</button>
        </div>
        <button type="button" class="pill-btn wide" id="test-conn">Probar conexión</button>

        <label class="field-label" for="assistant-name">Nombre del asistente</label>
        <input id="assistant-name" class="field" type="text" placeholder="Antares" maxlength="40">

        <label class="field-label" for="user-name">Tu nombre (cómo te va a llamar)</label>
        <input id="user-name" class="field" type="text" placeholder="Ej: Freddy" maxlength="40">

        <label class="field-label" for="personality">Personalidad / descripción (opcional)</label>
        <textarea id="personality" class="field area" rows="4" placeholder="Ej: Bromista, fan del fútbol, me ayuda con programación"></textarea>

        <label class="switch-row"><input type="checkbox" id="speak-replies"> <span>Leer las respuestas en voz alta</span></label>
        <label class="switch-row"><input type="checkbox" id="web-search"> <span>Buscar en Google cuando haga falta info actual</span></label>

        <button type="button" class="pill-btn wide primary" id="save-settings">Guardar</button>
        <p class="status" id="settings-status" role="status"></p>

        <div class="danger-zone">
          <p class="hint" id="facts-count"></p>
          <div class="row">
            <button type="button" class="pill-btn" id="clear-history">Borrar conversación</button>
            <button type="button" class="pill-btn" id="clear-facts">Borrar datos guardados</button>
          </div>
        </div>
        <p class="hint small" id="app-version"></p>
      </div>
    </section>

    <!-- ===== Diagnóstico ===== -->
    <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title">Diagnóstico de conexión</h2>
        <pre id="modal-body"></pre>
        <div class="row">
          <button type="button" class="pill-btn" id="modal-copy">Copiar</button>
          <button type="button" class="pill-btn primary" id="modal-close">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <noscript>Antares necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
