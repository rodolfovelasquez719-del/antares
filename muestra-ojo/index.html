<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antares · Ojo (muestra)</title>
<meta name="robots" content="noindex">
<style>
:root{--g:#22ff9a;--r:#ff3b5c;--bg:#03100b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--g);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
#globe{position:fixed;inset:0}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(34,255,154,.05) 0 1px,transparent 1px 3px);z-index:5}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75));z-index:4}
.br{position:fixed;width:26px;height:26px;border:2px solid var(--g);z-index:6;pointer-events:none;opacity:.8}
.tl{top:calc(env(safe-area-inset-top) + 8px);left:8px;border-right:0;border-bottom:0}.tr{top:calc(env(safe-area-inset-top) + 8px);right:8px;border-left:0;border-bottom:0}
.bl{bottom:calc(env(safe-area-inset-bottom) + 8px);left:8px;border-right:0;border-top:0}.brr{bottom:calc(env(safe-area-inset-bottom) + 8px);right:8px;border-left:0;border-top:0}
.cross{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px;z-index:6;pointer-events:none;opacity:.55}
.cross:before,.cross:after{content:"";position:absolute;background:var(--r)}.cross:before{left:50%;top:0;bottom:0;width:1px}.cross:after{top:50%;left:0;right:0;height:1px}
header{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:20px;right:20px;z-index:7;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
h1{margin:0;font-size:15px;letter-spacing:.25em}h1 b{color:var(--r)}
.sub{font-size:10px;opacity:.75;letter-spacing:.12em}
.clk{text-align:right;font-size:11px}
.tick{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);z-index:7;overflow:hidden;white-space:nowrap;font-size:10px;letter-spacing:.15em;border-top:1px solid rgba(34,255,154,.25);border-bottom:1px solid rgba(34,255,154,.25);background:rgba(0,20,12,.55);pointer-events:none}
.tick{-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tick span{display:inline-flex;padding:3px 0;animation:mq var(--dur,40s) linear infinite;will-change:transform}.tick span i{font-style:normal;flex:none;padding-right:4em}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media (prefers-reduced-motion:reduce){.tick span{animation:none}}
.stat{position:fixed;left:16px;top:calc(env(safe-area-inset-top) + 128px);z-index:7;font-size:10px;line-height:1.6;pointer-events:none;background:rgba(0,20,12,.5);padding:6px 8px;border-left:2px solid var(--g)}
.stat .no{color:var(--r)}
nav{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:8;display:flex;gap:6px;overflow-x:auto;padding:4px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:rgba(0,25,15,.8);color:var(--g);border:1px solid var(--g);border-radius:4px;padding:9px 11px;font:inherit;font-size:11px;letter-spacing:.08em}
nav button.off{color:#5b7d6c;border-color:#2b4a3a;text-decoration:line-through}
nav button.go{border-color:var(--r);color:var(--r)}
.city{color:#22ff9a;font-size:10px;white-space:nowrap;pointer-events:auto;cursor:pointer;transform:translate(-5px,-50%);text-shadow:0 0 4px #000,0 0 8px #000;display:flex;align-items:center;gap:4px;padding:6px 4px}.city i{width:8px;height:8px;border-radius:50%;background:#22ff9a;box-shadow:0 0 8px #22ff9a}.city b{color:#fff;font-weight:600}

#map{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .7s ease;background:#010805}
body.mapa #map{opacity:1;pointer-events:auto}body.mapa #globe{opacity:0;pointer-events:none}#globe{transition:opacity .7s ease}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(0,0,0,.55)!important;color:#7fb79a!important}.maplibregl-ctrl-attrib a{color:#9fd!important}
.maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom) + 64px)!important}
.bus{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 84px);z-index:10;display:flex;gap:6px}
.bus input{flex:1;min-width:0;height:36px;background:rgba(0,20,12,.85);border:1px solid rgba(34,255,154,.6);color:#d9ffe9;font:inherit;font-size:16px;padding:0 10px;border-radius:4px;outline:none}
.bus input::placeholder{color:#5b8d74}
.bus button{flex:0 0 auto;height:36px;background:rgba(0,25,15,.85);border:1px solid var(--r);color:var(--r);font:inherit;font-size:11px;border-radius:4px;padding:0 10px}
.res{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 124px);z-index:11;background:rgba(0,18,11,.96);border:1px solid var(--g);display:none;max-height:45vh;overflow:auto}
.res.on{display:block}.res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(34,255,154,.2);color:#d9ffe9;font:inherit;font-size:12px;padding:9px 10px}
.res small{color:#7fb79a}
.yo{width:18px;height:18px;border-radius:50%;background:#3ad6ff;border:2px solid #fff;box-shadow:0 0 0 0 rgba(58,214,255,.7);animation:yo 1.8s infinite;transform:translate(-50%,-50%)}
@keyframes yo{70%{box-shadow:0 0 0 18px rgba(58,214,255,0)}100%{box-shadow:0 0 0 0 rgba(58,214,255,0)}}
.pin{width:14px;height:14px;background:var(--r);border:2px solid #fff;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 0 10px var(--r)}
.aviso{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 124px);z-index:12;background:rgba(40,0,8,.94);border:1px solid var(--r);color:#ffd7de;padding:10px 12px;font-size:12px;display:none}.aviso.on{display:block}
body.app .clk,body.app .sub{display:none}
.card{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:9;background:rgba(0,18,11,.92);border:1px solid var(--g);padding:12px 14px;display:none;box-shadow:0 0 18px rgba(34,255,154,.25)}
.card.on{display:block}.card h2{margin:0 0 6px;font-size:14px;color:var(--r);letter-spacing:.1em}
.card table{width:100%;border-collapse:collapse;font-size:12px}.card td{padding:2px 0}.card td:first-child{opacity:.7;width:42%}
.card .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--g);font-size:20px}
.card .dem{color:#ffc857;font-size:10px;margin-top:6px}
.legal{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 128px);z-index:7;font-size:9px;opacity:.6;text-align:right;max-width:150px;pointer-events:none}
</style></head><body>
<div id="globe"></div><div id="map"></div><div class="vig"></div><div class="scan"></div>
<div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div><div class="cross"></div>
<header><div><h1>ANTARES · <b>OJO</b></h1><div class="sub">MUESTRA · SOLO DATOS PÚBLICOS</div></div><div class="clk" id="clk">--:--:--</div></header>
<div class="tick"><span id="tick">PROCESANDO FLUJO DE DATOS ◆ INICIANDO ENLACES ◆</span></div>
<div class="bus"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar lugar o dirección…" aria-label="Buscar lugar"><button id="yo" type="button">◉ MI UBICACIÓN</button></div><div class="res" id="res"></div><div class="aviso" id="aviso"></div>
<div class="stat" id="stat"></div>
<div class="legal">Fuentes abiertas: USGS · CelesTrak · Open-Meteo · RainViewer · ADS-B público. Sin cámaras ni personas.</div>
<div class="card" id="card"><button class="x" id="cx" aria-label="Cerrar">×</button><h2 id="ct"></h2><table id="cb"></table><div class="dem" id="cd"></div></div>
<nav id="nav">
<button class="go" data-go="cr">◎ COSTA RICA</button><button class="go" data-go="gam">◎ GAM</button><button class="go" data-go="mundo">◯ MUNDO</button>
<button data-l="avi">✈ AVIONES</button><button data-l="sis">◉ SISMOS</button><button data-l="sat">✦ SATÉLITES</button><button data-l="cli">☂ CLIMA</button><button data-l="rad">▦ RADAR</button><button data-l="rut">➝ RUTAS (EJEMPLO)</button><button data-l="sate" class="off">🛰 VISTA SATÉLITE</button><button data-l="b3d">▲ EDIFICIOS 3D</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const on={avi:true,sis:true,sat:true,cli:true,rad:false,rut:true,sate:false,b3d:true};
const APP=/[?&]app=1/.test(location.search);if(APP)document.body.classList.add("app");
const st={avi:"…",sis:"…",sat:"…",cli:"…",rad:"apagado",rut:"…"};
const D={avi:[],sis:[],sat:[],cli:[],rut:[]};
const NAMES={avi:"AVIONES",sis:"SISMOS",sat:"SATÉLITES",cli:"CLIMA",rad:"RADAR",rut:"RUTAS"};
const ticker=[];
function paintStat(){$("#stat").innerHTML=Object.keys(st).map(k=>`${NAMES[k]}: <span class="${/no disp/.test(st[k])?"no":""}">${st[k]}</span>`).join("<br>");
 setTick(["PROCESANDO FLUJO DE DATOS",...ticker.slice(-8),"ENLACES ACTIVOS: "+Object.values(st).filter(v=>/^\d/.test(v)).length].join("  ◆  "));}
// marquesina continua: el texto se repite para llenar el ancho y avanza a velocidad fija;
// el texto nuevo entra al terminar cada vuelta (sin saltos)
let tickNext=null,tickTxt="",tickBoot=true;
function setTick(t){if(t===tickTxt)return;tickNext=t;if(tickBoot)applyTick()}
function applyTick(){if(tickNext==null)return;const s=$("#tick"),box=s.parentElement,t=tickNext;tickNext=null;tickTxt=t;
 const mk=h=>{const i=document.createElement("i");i.textContent=t+"  ◆  ";if(h)i.setAttribute("aria-hidden","true");return i};
 s.replaceChildren(mk(false));const u=s.firstChild.getBoundingClientRect().width||1,n=Math.max(1,Math.ceil(box.clientWidth/u));
 for(let k=1;k<2*n;k++)s.appendChild(mk(true));
 s.style.setProperty("--dur",(u*n/60).toFixed(1)+"s");s.style.animation="none";void s.offsetWidth;s.style.animation="";
 tickBoot=/INICIANDO/.test(t)||ticker.length<2;}
$("#tick").addEventListener("animationiteration",applyTick);
addEventListener("resize",()=>{if(tickTxt){tickNext=tickTxt;tickTxt="";applyTick()}});
// la app pide pausar antes de cerrar: se detiene el dibujo para que el cierre no se trabe
addEventListener("message",e=>{if(e.origin===location.origin&&e.data==="ojo:pausa"){try{G.pauseAnimation()}catch{}document.body.style.display="none"}});
setInterval(()=>{$("#clk").innerHTML=new Date().toLocaleTimeString("es-CR",{hour12:false})+"<br>"+new Date().toISOString().slice(11,19)+" UTC"},1000);
async function getJ(u,ms=12000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error(r.status);return u.includes("FORMAT=tle")?await r.text():await r.json()}finally{clearTimeout(t)}}

const lowEnd=/Android/.test(navigator.userAgent)||(navigator.hardwareConcurrency||4)<=4;
let G;
try{
 G=Globe({rendererConfig:{antialias:!lowEnd,powerPreference:"low-power"}})($("#globe"))
 .globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.34.0/example/img/earth-dark.jpg")
 .bumpImageUrl(lowEnd?null:"https://cdn.jsdelivr.net/npm/three-globe@2.34.0/example/img/earth-topology.png")
 .backgroundColor("rgba(0,0,0,0)").atmosphereColor("#22ff9a").atmosphereAltitude(.18)
 .width(innerWidth).height(innerHeight);
 G.renderer().setPixelRatio(Math.min(devicePixelRatio,lowEnd?1.5:2));
 G.pointOfView({lat:12,lng:-40,altitude:3.2},0);
}catch(e){document.body.insertAdjacentHTML("beforeend",'<div class="card on"><h2>WEBGL NO DISPONIBLE</h2>Este dispositivo no puede mostrar el globo 3D.</div>');throw e}
addEventListener("resize",()=>G.width(innerWidth).height(innerHeight));
document.addEventListener("visibilitychange",()=>document.hidden?G.pauseAnimation():G.resumeAnimation());
const CR={lat:9.9,lng:-84.1,altitude:.22};
setTimeout(()=>G.pointOfView(CR,4500),900);
fetch("https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@v2.46.2/example/datasets/ne_110m_admin_0_countries.geojson").then(r=>r.json()).then(g=>{
 G.polygonsData(g.features).polygonAltitude(.0015).polygonCapColor(f=>f.properties.ISO_A2==="CR"?"rgba(34,255,154,.10)":"rgba(0,0,0,0)").polygonSideColor(()=>"rgba(0,0,0,0)").polygonStrokeColor(f=>f.properties.ISO_A2==="CR"?"#22ff9a":"rgba(34,255,154,.35)").polygonsTransitionDuration(0)}).catch(()=>{});

// ---- tarjeta
function card(t,rows,dem){$("#ct").textContent=t;$("#cb").innerHTML=rows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("");$("#cd").textContent=dem||"";$("#card").classList.add("on")}
$("#cx").onclick=()=>$("#card").classList.remove("on");
const esc=s=>String(s??"—").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

// ---- capas -> globo
function render(){
 const pts=[...(on.sis?D.sis.map(s=>({...s,k:"sis",alt:.002})):[])];
 const COL={cli:"#22ff9a",sis:"#ff3b5c"};
 G.pointsData(pts).pointLat("lat").pointLng("lng").pointAltitude("alt").pointRadius(d=>d.k==="cli"?.09:Math.max(.05,d.mag*.03)).pointColor(d=>COL[d.k]).pointResolution(6).pointsMerge(false)
  .onPointClick(clickObj);
 G.ringsData(on.sis?D.sis.filter(s=>s.mag>=4):[]).ringLat("lat").ringLng("lng").ringColor(()=>t=>`rgba(255,59,92,${(1-t)*.8})`)
  .ringMaxRadius(d=>d.mag*.45).ringPropagationSpeed(d=>.3+d.mag*.12).ringRepeatPeriod(d=>Math.max(900,3600-d.mag*400)).ringResolution(lowEnd?24:48);
 const parts=[];if(on.avi&&D.avi.length)parts.push(Object.assign(D.avi.slice(),{c:"#ffc857",s:7}));if(on.sat&&D.sat.length)parts.push(Object.assign(D.sat.slice(),{c:"#9fe8ff",s:5}));if(on.sat&&D.issPt)parts.push(Object.assign([D.issPt],{c:"#ff3b5c",s:14}));
 G.particlesData(parts).particleLat("lat").particleLng("lng").particleAltitude("alt").particlesColor(p=>p.c).particlesSize(p=>p.s).particlesSizeAttenuation(false).particleLabel(()=>"").onParticleClick(clickObj);
 G.htmlElementsData([...(on.cli?D.cli:[]),...(D.yo?[D.yo]:[]),...(D.busq?[D.busq]:[])]).htmlLat("lat").htmlLng("lng").htmlAltitude(.005).htmlElement(d=>{const e=document.createElement("div");if(d.k==="yo"){e.className="yo";return e}if(d.k==="busq"){e.className="pin";e.title=d.name;return e}e.className="city";e.innerHTML=`<i></i>${esc(d.name)} <b>${d.t}°</b>`;e.onclick=()=>clickObj(d);return e}).htmlTransitionDuration(0);
 G.labelsData([...(on.sat&&D.issPt?[{...D.issPt,name:"ISS"}]:[])]).labelLat("lat").labelLng("lng").labelAltitude(d=>d.k==="iss"?d.alt:.005).labelText(d=>d.k==="iss"?"ISS":d.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"")+" "+d.t).labelSize(d=>d.k==="iss"?1.2:.1).labelDotRadius(0).labelColor(d=>d.k==="iss"?"#ff3b5c":"#22ff9a").labelResolution(2);
 const paths=[...(on.rut?D.rut:[]),...(on.sat&&D.iss?[D.iss]:[])];
 G.pathsData(paths).pathPoints("pts").pathPointLat(p=>p[0]).pathPointLng(p=>p[1]).pathPointAlt(p=>p[2]||.004)
  .pathColor(p=>p.c).pathStroke(p=>p.w||2).pathDashLength(p=>p.dash||1).pathDashGap(p=>p.dash?.25:0).pathDashAnimateTime(p=>p.dash?2500:0).pathTransitionDuration(0)
  .onPathClick(p=>p.info&&card(p.info[0],p.info[1],p.info[2]));
}
function clickObj(o){
 if(o.k==="cli")return card("☂ CLIMA · "+o.name,[["Temperatura",o.t+" °C"],["Lluvia ahora",o.p+" mm"],["Prob. lluvia (hora)",o.pp+" %"],["Viento",o.w+" km/h"],["Fuente","Open-Meteo"]]);
 if(o.k==="avi")card("✈ "+(o.cs||"SIN INDICATIVO"),[["Altitud",o.altm!=null?Math.round(o.altm)+" m":"—"],["Velocidad",o.v!=null?Math.round(o.v)+" km/h":"—"],["País de origen",esc(o.pais)],["Rumbo",o.hdg!=null?Math.round(o.hdg)+"°":"—"],["Fuente",o.src]]);
 else if(o.k==="sat"||o.k==="iss")card((o.k==="iss"?"★ ":"✦ ")+o.name,[["Altitud",Math.round(o.km)+" km"],["Latitud",o.lat.toFixed(2)],["Longitud",o.lng.toFixed(2)],["Fuente","CelesTrak + satellite.js"]]);
 else if(o.k==="sis")card("◉ SISMO M"+o.mag.toFixed(1),[["Lugar",esc(o.place)],["Hora",new Date(o.time).toLocaleString("es-CR")],["Profundidad",o.depth.toFixed(0)+" km"],["Fuente","USGS"]]);
}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="ojo.js"></script>
<script src="mapa.js"></script>
</body></html>
