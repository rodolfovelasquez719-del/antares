<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020805"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Antares · Bloqueo nuevo (muestra)</title>
<style>
@font-face{font-family:Orbitron;src:url(../fonts/orbitron-latin.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:Rajdhani;src:url(../fonts/rajdhani-600-latin.woff2) format("woff2");font-weight:500 700;font-display:swap}
:root{--bg:#020805;--txt:#e3fff1;--dim:#8fbfa6;--verde:#00ff9c;--rojo:#ff2d4a;--hud:Orbitron,system-ui,sans-serif;--ui:Rajdhani,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ARREGLO 1: sin zoom de doble toque (iOS) en toda la pantalla: tocar ⌫ o un número dos veces seguidas ya no hace zoom */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);overflow:hidden}
/* ARREGLO 2: la pantalla de bloqueo ocupa la pantalla completa fija; NO depende del visualViewport (que cambia con el zoom) */
.bloqueo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 26px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(520px 380px at 50% 26%,rgba(0,255,156,.10),transparent 70%),
    linear-gradient(rgba(0,255,156,.035) 1px,transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg,rgba(0,255,156,.035) 1px,transparent 1px) 0 0/28px 100%,
    linear-gradient(180deg,#041a10,var(--bg) 60%)}
.volver{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;font:600 13px var(--ui);color:var(--dim);text-decoration:none;border:1px solid #1d5a3c;border-radius:10px;padding:6px 10px;background:#03100acc}
.muestra{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;font:700 9px var(--hud);letter-spacing:2px;color:var(--rojo);opacity:.8}
/* --- cerebro animado (reemplaza la foto) --- */
.orbe{position:relative;flex:none;width:148px;height:148px;contain:layout}
.orbe canvas{position:absolute;inset:-10%;width:120%;height:120%;display:block}
.anillo{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,255,156,.55);box-shadow:0 0 18px rgba(0,255,156,.25),inset 0 0 18px rgba(0,255,156,.12);will-change:transform}
.anillo.a1{inset:-6px;border-style:dashed;border-color:rgba(0,255,156,.35);animation:gira 26s linear infinite}
.anillo.a2{inset:-14px;border:1px solid transparent;border-top-color:rgba(255,45,74,.7);border-bottom-color:rgba(255,45,74,.35);animation:gira 9s linear infinite reverse;box-shadow:none}
@keyframes gira{to{transform:rotate(1turn)}}
.candado{position:absolute;right:-2px;bottom:-2px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#0a0306;border:1px solid rgba(255,45,74,.65);box-shadow:0 0 12px rgba(255,45,74,.45);z-index:2;transition:border-color .3s,box-shadow .3s}
.candado svg{width:20px;height:20px;color:#ff4d66}
[data-st=ok] .candado{border-color:var(--verde);box-shadow:0 0 14px var(--verde)}[data-st=ok] .candado svg{color:var(--verde)}
h1{outline:none;margin:20px 0 4px;font:700 19px var(--hud);letter-spacing:3px;text-align:center;text-shadow:0 0 10px rgba(0,255,156,.55)}
.sub{margin:0;font-size:17px;color:var(--dim);text-align:center}
/* ARREGLO 3: puntos de tamaño fijo; solo cambian color y escala (transform), nunca el tamaño ni el layout */
.puntos{display:flex;gap:16px;margin:20px 0 4px;height:18px}
.puntos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--verde);transform:scale(1);transition:background-color .12s,box-shadow .12s,transform .12s}
.puntos i.on{background:var(--verde);box-shadow:0 0 10px var(--verde);transform:scale(1.12)}
[data-st=error] .puntos i{border-color:var(--rojo)}[data-st=error] .puntos i.on{background:var(--rojo);box-shadow:0 0 10px var(--rojo)}
[data-st=error] .puntos{animation:temblor .4s ease-in-out}
@keyframes temblor{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.msg{height:24px;margin:4px 0 10px;font-size:16px;font-weight:600;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
[data-st=error] .msg{color:var(--rojo)}[data-st=ok] .msg{color:var(--verde)}
.teclado{display:grid;grid-template-columns:repeat(3,76px);gap:12px 30px}
.tecla{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;align-content:center;cursor:pointer;touch-action:manipulation;
  font:600 34px/1 var(--ui);color:var(--txt);background:radial-gradient(circle at 50% 35%,#0e331c,#07200f 70%);border:1px solid rgba(0,255,156,.38);
  box-shadow:inset 0 0 14px rgba(0,255,156,.10);transition:transform .08s,background-color .1s;will-change:transform}
.tecla small{font:600 11px var(--ui);letter-spacing:2px;color:var(--dim);margin-top:1px}
.tecla.pulsada{transform:scale(.93);background:#0f4a2a}
.tecla.fantasma{background:transparent;border-color:transparent;box-shadow:none;color:#5dffb8}.tecla.fantasma svg{width:30px;height:30px}
.bio{margin-top:16px;min-width:260px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 17px var(--ui);color:var(--txt);background:#0a120e;border:1px solid rgba(255,45,74,.35);border-radius:14px;cursor:pointer;touch-action:manipulation}
.bio svg{width:22px;height:22px}
.olvido{margin-top:10px;background:none;border:0;font:600 15px var(--ui);color:#5dffb8;text-decoration:underline;cursor:pointer;min-height:40px;touch-action:manipulation}
.ver{position:absolute;bottom:calc(6px + env(safe-area-inset-bottom));left:0;right:0;margin:0;text-align:center;font-size:11px;letter-spacing:1px;color:rgba(159,212,182,.7)}
@media (max-height:700px){.orbe{width:96px;height:96px}.teclado{grid-template-columns:repeat(3,68px);gap:10px 26px}.tecla{width:68px;height:68px;font-size:30px}h1{margin-top:10px}}
/* ARREGLO 4: movimiento reducido: sin giros, sin temblor, sin pulsos */
@media (prefers-reduced-motion:reduce){.anillo.a1,.anillo.a2{animation:none}[data-st=error] .puntos{animation:none}.puntos i,.tecla{transition:none}}
</style></head>
<body>
<div class="bloqueo" id="bloqueo" data-st="normal">
  <a class="volver" href="../">← Antares</a><span class="muestra">MUESTRA</span>
  <div class="orbe" aria-hidden="true">
    <canvas id="cerebro"></canvas>
    <span class="anillo a2"></span><span class="anillo a1"></span>
    <span class="candado"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="currentColor"/><path id="arco" d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
  </div>
  <h1 id="titulo" tabindex="-1">ANTARES BLOQUEADO</h1>
  <p class="sub">Ingrese su código de seguridad</p>
  <div class="puntos" id="puntos" role="img" aria-label="0 de 6 dígitos ingresados"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p class="msg" id="msg" role="status">Muestra: el código es 123456</p>
  <div class="teclado" id="teclado">
    <button class="tecla" type="button" data-d="1">1<small>&nbsp;</small></button>
    <button class="tecla" type="button" data-d="2">2<small>ABC</small></button>
    <button class="tecla" type="button" data-d="3">3<small>DEF</small></button>
    <button class="tecla" type="button" data-d="4">4<small>GHI</small></button>
    <button class="tecla" type="button" data-d="5">5<small>JKL</small></button>
    <button class="tecla" type="button" data-d="6">6<small>MNO</small></button>
    <button class="tecla" type="button" data-d="7">7<small>PQRS</small></button>
    <button class="tecla" type="button" data-d="8">8<small>TUV</small></button>
    <button class="tecla" type="button" data-d="9">9<small>WXYZ</small></button>
    <button class="tecla fantasma" type="button" id="cara" aria-label="Usar Face ID"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 16a4 4 0 0 0 5 0"/></svg></button>
    <button class="tecla" type="button" data-d="0">0<small>&nbsp;</small></button>
    <button class="tecla fantasma" type="button" id="borrar" aria-label="Borrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7zM12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
  </div>
  <button class="bio" type="button" id="bio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 11v4M8.5 12.5c0-2 1.5-3.5 3.5-3.5s3.5 1.5 3.5 3.5c0 2.5-.5 4.5-1.5 6.5M5.5 15c-.3-.9-.5-1.8-.5-2.8C5 8.2 8.1 5 12 5s7 3.2 7 7.2c0 1.2-.1 2.3-.4 3.3M9.5 19c.8-1.5 1.1-3.2 1.1-5"/></svg>Usar Face ID / huella</button>
  <button class="olvido" type="button" id="olvido">¿Olvidó su código?</button>
  <p class="ver">v1.26.0 · muestra bloqueo</p>
</div>
<script type="module" src="bloqueo.js?v=1"></script>
</body></html>
