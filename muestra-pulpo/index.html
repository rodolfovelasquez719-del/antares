<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<title>Antares Pulpo · muestra</title>
<style>
:root{--v:#00ff9c;--r:#ff2d4a;--bg:#02060a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 42%,#06201a 0%,#02060a 62%);color:#d9fff0;font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
h1{margin:0;font-size:17px;letter-spacing:.14em;font-weight:700;color:var(--v);text-shadow:0 0 12px #00ff9c88}
h1 small{display:block;font-size:11px;letter-spacing:.06em;color:#8fbfae;font-weight:400}
.corazones{display:flex;gap:6px;pointer-events:auto}
.cz{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 6px;border:1px solid #00ff9c33;border-radius:10px;background:#03130eaa;min-width:62px;font-size:10px;color:#a8d8c6;cursor:pointer}
.cz svg{width:20px;height:20px;fill:var(--v);filter:drop-shadow(0 0 5px var(--v));animation:latido 1s ease-in-out infinite}
.cz[data-e=rev] svg{fill:#ffc84a;filter:drop-shadow(0 0 5px #ffc84a);animation-duration:1.6s}
.cz[data-e=off] svg{fill:#4a5652;filter:none;animation:none;opacity:.6}
.cz[data-e=off]{border-color:#ff2d4a44}
.cz b{font-size:10px;font-weight:600;color:#e6fff6}
.cz i{font-style:normal;font-size:9.5px}
.cz[data-e=off] i{color:#ff7b8c}
@keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(.95)}45%{transform:scale(1.15)}}
.brazo{position:fixed;z-index:2;transform:translate(-50%,-50%);border:1px solid #00ff9c55;background:#031410d0;color:#dfffee;border-radius:14px;padding:5px 9px;font:600 12px system-ui,sans-serif;display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:border-color .3s,box-shadow .3s}
.brazo::before{content:"";width:7px;height:7px;border-radius:50%;background:#5f7f74}
.brazo[data-e=pensando]::before{background:var(--v);box-shadow:0 0 8px var(--v);animation:parp .5s infinite alternate}
.brazo[data-e=alerta]{border-color:var(--r);box-shadow:0 0 14px #ff2d4a88}
.brazo[data-e=alerta]::before{background:var(--r);box-shadow:0 0 8px var(--r);animation:parp .25s infinite alternate}
.brazo.sel{border-color:var(--v);box-shadow:0 0 16px #00ff9caa}
@keyframes parp{to{opacity:.3}}
#estado{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;font-size:12.5px;color:#9fd9c3;z-index:2;padding:0 16px;pointer-events:none}
#estado b{color:var(--v)}#estado.alerta b{color:var(--r)}
.hoja{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;background:#04140fef;border:1px solid #00ff9c55;border-radius:18px;padding:16px 16px 14px;box-shadow:0 0 30px #00ff9c33;transform:translateY(130%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:520px;margin:0 auto}
.hoja.ver{transform:none}
.hoja.alerta{border-color:var(--r);box-shadow:0 0 30px #ff2d4a44}
.hoja h2{margin:0 0 4px;font-size:18px;color:var(--v)}.hoja.alerta h2{color:var(--r)}
.hoja .est{font-size:12px;color:#8fbfae;margin-bottom:8px}
.hoja p{margin:0 0 8px}.hoja ul{margin:0 0 10px;padding-left:18px;color:#c3eadb;font-size:13.5px}
.hoja button{background:transparent;border:1px solid #00ff9c88;color:var(--v);border-radius:12px;padding:9px 16px;font:600 14px system-ui;width:100%}
.demo{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 40px);z-index:2;font-size:11px;color:#8fbfae;display:flex;align-items:center;gap:6px}
.demo input{accent-color:#00ff9c}
@media (prefers-reduced-motion:reduce){.cz svg,.brazo::before{animation:none!important}}
</style>
</head><body>
<canvas id="c" aria-hidden="true"></canvas>
<header>
  <h1>ANTARES<small>Pulpo · muestra</small></h1>
  <div class="corazones" role="list" aria-label="Tres corazones">
    <div class="cz" id="cz-gem" role="listitem" data-e="rev"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><b>Gemini</b><i>…</i></div>
    <div class="cz" id="cz-pc" role="listitem" data-e="rev"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><b>Cerebro local</b><i>…</i></div>
    <div class="cz" id="cz-off" role="listitem" data-e="rev"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><b>Sin internet</b><i>…</i></div>
  </div>
</header>
<div id="brazos"></div>
<div id="estado">Toque un brazo para ver qué hace.</div>
<label class="demo"><input type="checkbox" id="demo" checked> Modo demostración</label>
<section class="hoja" id="hoja" role="dialog" aria-modal="false" aria-labelledby="h-t">
  <h2 id="h-t"></h2><div class="est" id="h-e"></div><p id="h-d"></p><ul id="h-l"></ul>
  <button id="h-c">Cerrar</button>
</section>
<script type="module" src="./pulpo.js?v=3"></script>
</body></html>
