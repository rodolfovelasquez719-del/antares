<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020805"><title>Antares · Muestra avatar vivo</title>
<style>
@font-face{font-family:"Orbitron";src:url("../fonts/orbitron-latin.woff2") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Rajdhani";src:url("../fonts/rajdhani-600-latin.woff2") format("woff2");font-weight:600;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020805;color:#e4fff0;font-family:"Rajdhani",system-ui,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
h1{margin:0;font-family:"Orbitron",monospace;font-size:17px;letter-spacing:4px;text-shadow:0 0 10px #00ff9c}
.tag{font-family:"Orbitron",monospace;font-size:9px;letter-spacing:1.5px;color:#ff5a6e;border:1px solid rgba(255,59,78,.5);padding:3px 6px;border-radius:6px}
#st{font-family:"Orbitron",monospace;font-size:12px;letter-spacing:2px;color:#00ff9c;min-width:80px;text-align:right}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.say{padding:4px 16px;min-height:46px;font-size:17px;text-align:center}
.row{display:flex;gap:6px;padding:4px 12px}
.row:last-child{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
button{flex:1;min-height:44px;font-family:"Orbitron",monospace;font-size:10px;letter-spacing:1px;color:#cfeedd;background:#05170e;border:1px solid rgba(0,255,156,.35);border-radius:10px}
button.on{background:#00ff9c;color:#02130a}
.note{font-size:12px;color:#8fb8a2;text-align:center;padding:0 14px 4px}
</style></head><body>
<div class="app">
<header><h1>ANTARES</h1><span class="tag">MUESTRA</span><span id="st">REPOSO</span></header>
<div class="stage"><canvas id="cv"></canvas></div>
<div class="say" id="say">Buenas tardes, Freddy. ¿En qué le puedo ayudar?</div>
<div class="row"><button data-s="idle" class="on">REPOSO</button><button data-s="listen">ESCUCHA</button><button data-s="think">PIENSA</button><button data-s="speak">HABLA</button></div>
<div class="row"><button id="tts">🔊 QUE HABLE</button><button id="mic">🎙 QUE ESCUCHE</button><button id="tilt">📱 INCLINAR</button></div>
<p class="note">Muestra: sin video, una sola imagen con capas animadas. Mueva el dedo sobre ella o incline el teléfono.</p>
</div>
<script>
const cv=document.getElementById("cv"),x=cv.getContext("2d"),DPR=Math.min(2,devicePixelRatio||1);
let S="idle",level=0,target=0,micLvl=0,tx=0,ty=0,px=0,py=0,blinkT=0,nextBlink=2500,ripples=[];
const IW=640,IH=720,EYES=[[245,216],[398,216]],MOUTH=[320,360];
const SAY={idle:"Buenas tardes, Freddy. ¿En qué le puedo ayudar?",listen:"Le escucho…",think:"Analizando su solicitud…",speak:"Con gusto. Tiene tres recordatorios para hoy y el clima está despejado."};
function setS(s){S=s;document.getElementById("st").textContent={idle:"REPOSO",listen:"ESCUCHA",think:"PIENSA",speak:"HABLA"}[s];document.getElementById("say").textContent=SAY[s];document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s==s))}
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>setS(b.dataset.s));
// ---------- imagen y capas precalculadas (una vez) ----------
const img=new Image();img.src="retrato.jpg";let sprite,circ,lid=[];
img.onload=()=>{
  // retrato con bordes difuminados (máscara en canvas: nada de recortes CSS)
  sprite=document.createElement("canvas");sprite.width=IW;sprite.height=IH;const s=sprite.getContext("2d");s.drawImage(img,0,0);
  s.globalCompositeOperation="destination-in";s.save();s.translate(IW/2,IH*.47);s.scale(1,IH/IW*1.02);const g=s.createRadialGradient(0,0,IW*.22,0,0,IW*.5);g.addColorStop(0,"#000");g.addColorStop(.6,"rgba(0,0,0,.85)");g.addColorStop(1,"rgba(0,0,0,0)");s.fillStyle=g;s.fillRect(-IW,-IW,IW*2,IW*2);s.restore();
  // circuitos: solo los píxeles verdes/rojos brillantes del cuello y cuerpo
  const d=s.getImageData(0,0,IW,IH),o=new ImageData(IW,IH);
  for(let y=380;y<IH;y++)for(let X=0;X<IW;X++){const i=(y*IW+X)*4,r=d.data[i],G=d.data[i+1],b=d.data[i+2];
    if((G>120&&G>r*1.6&&G>b*1.3)||(r>130&&r>G*1.8&&r>b*1.5)){o.data[i]=r;o.data[i+1]=G;o.data[i+2]=b;o.data[i+3]=255}}
  circ=document.createElement("canvas");circ.width=IW;circ.height=IH;circ.getContext("2d").putImageData(o,0,0);
  // color de piel sobre cada ojo para el párpado
  lid=EYES.map(([ex,ey])=>{const p=s.getImageData(ex-4,ey-24,8,6).data;let r=0,g=0,b=0;for(let i=0;i<p.length;i+=4){r+=p[i];g+=p[i+1];b+=p[i+2]}const n=p.length/4;return`rgb(${r/n|0},${g/n|0},${b/n|0})`});
};
// ---------- red de nodos que orbita (como el cerebro) ----------
const N=46,nodes=[];for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.39996;nodes.push([Math.cos(th)*r,y*.75,Math.sin(th)*r,i%7==0])}
const links=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=nodes[i],b=nodes[j];if(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])<.52)links.push([i,j])}
// ---------- inclinación: dedo o giroscopio ----------
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2});
cv.addEventListener("pointerleave",()=>{tx=ty=0});
function onOri(e){if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,(e.beta-45)/25))}
document.getElementById("tilt").onclick=async()=>{try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const p=await DeviceOrientationEvent.requestPermission();if(p!=="granted")return}window.addEventListener("deviceorientation",onOri);document.getElementById("tilt").classList.add("on")}catch{}};
// ---------- voz: TTS real con envolvente por palabra; micrófono real con analizador ----------
document.getElementById("tts").onclick=()=>{if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SAY.speak);u.lang="es-ES";
  u.onstart=()=>{setS("speak");target=.7};u.onboundary=()=>{level=1};u.onend=u.onerror=()=>{target=0;setS("idle")};speechSynthesis.speak(u);setS("speak");target=.7};
let micStream=null,an=null,buf=null;
document.getElementById("mic").onclick=async()=>{const b=document.getElementById("mic");
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;an=null;b.classList.remove("on");setS("idle");return}
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();an=ac.createAnalyser();an.fftSize=512;buf=new Uint8Array(an.fftSize);ac.createMediaStreamSource(micStream).connect(an);b.classList.add("on");setS("listen")}catch{document.getElementById("say").textContent="No hay permiso de micrófono; la onda se simula."}};
// ---------- dibujo ----------
let last=performance.now();
function frame(t){requestAnimationFrame(frame);const dt=Math.min(50,t-last);last=t;
  const r=cv.getBoundingClientRect(),W=Math.round(r.width*DPR),H=Math.round(r.height*DPR);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  // niveles
  if(S==="speak"&&target===0)target=.6; if(S!=="speak"&&!speechSynthesis.speaking)target=0;
  const synth=S==="speak"?(.35+.35*Math.abs(Math.sin(t/90))*Math.abs(Math.sin(t/233))):0;
  level+=((Math.max(target*.6,synth))-level)*.18; level=Math.max(0,level);
  if(an){an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));micLvl+=(m/60-micLvl)*.3}else micLvl+=((S==="listen"?.35+.25*Math.sin(t/300):0)-micLvl)*.1;
  px+=(tx-px)*.06;py+=(ty-py)*.06;
  const act=S==="think"?1:S==="speak"?.8:S==="listen"?.5:.2;
  const cx=W/2,cy=H*.5,sc=Math.min(W/IW*.92,H/IH*.9),breath=1+.012*Math.sin(t/1400),sway=Math.sin(t/3100)*.012+px*.03;
  const rot=t/1000*(.12+act*.35);
  // red trasera
  net(cx,cy,sc*IW*.78,rot,false,act,t);
  // retrato con respiración, balanceo y paralaje
  x.save();x.translate(cx+px*10*DPR,cy+py*6*DPR);x.rotate(sway);x.scale(sc*breath,sc*breath);x.translate(-IW/2,-IH/2);
  // halo
  const glow=.25+act*.15+level*.5,hg=x.createRadialGradient(IW/2,IH*.38,40,IW/2,IH*.45,IW*.62);hg.addColorStop(0,`rgba(0,255,156,${glow*.35})`);hg.addColorStop(1,"rgba(0,255,156,0)");x.fillStyle=hg;x.fillRect(-60,-60,IW+120,IH+120);
  if(sprite){x.drawImage(sprite,0,0);
    // párpados (parpadeo)
    blinkT+=dt;if(blinkT>nextBlink){const k=(blinkT-nextBlink)/160;const c=k<1?k:k<2?2-k:0;if(k>2){blinkT=0;nextBlink=2200+Math.random()*3500}
      if(c>0)EYES.forEach(([ex,ey],i)=>{x.fillStyle=lid[i];x.beginPath();x.ellipse(ex,ey-14+14*c,33,15*c+2,0,0,6.283);x.fill()})}
    x.globalCompositeOperation="lighter";
    // brillo de ojos
    EYES.forEach(([ex,ey])=>{const a=.18+act*.12+(S==="think"?.25*Math.abs(Math.sin(t/300)):0);const g=x.createRadialGradient(ex,ey,0,ex,ey,26);g.addColorStop(0,`rgba(120,220,255,${a})`);g.addColorStop(1,"rgba(0,150,255,0)");x.fillStyle=g;x.fillRect(ex-30,ey-30,60,60)});
    // circuitos que laten
    x.globalAlpha=Math.min(1,.15+.25*(.5+.5*Math.sin(t/700))+level*.9+act*.1);x.drawImage(circ,0,0);
    // pulso que recorre los circuitos (banda vertical)
    const bandY=380+((t/8)%380);x.globalAlpha=.6;x.save();x.beginPath();x.rect(0,bandY-18,IW,36);x.clip();x.drawImage(circ,0,0);x.restore();x.globalAlpha=1;
    // brillo del cabello
    const hx=((t/12)%(IW+300))-150;const hgd=x.createLinearGradient(hx-60,0,hx+60,0);hgd.addColorStop(0,"rgba(160,220,255,0)");hgd.addColorStop(.5,"rgba(160,220,255,.07)");hgd.addColorStop(1,"rgba(160,220,255,0)");x.fillStyle=hgd;x.fillRect(0,0,IW,330);
    // luz en la boca al hablar
    if(level>.02){const g=x.createRadialGradient(MOUTH[0],MOUTH[1],0,MOUTH[0],MOUTH[1],48);g.addColorStop(0,`rgba(255,90,120,${level*.45})`);g.addColorStop(1,"rgba(255,60,90,0)");x.fillStyle=g;x.fillRect(MOUTH[0]-50,MOUTH[1]-50,100,100)}
    x.globalCompositeOperation="source-over"}
  x.restore();
  // ondas de escucha
  if(S==="listen"&&ripples.length<4&&Math.random()<.03+micLvl*.2)ripples.push({r:0,a:.6});
  ripples=ripples.filter(p=>(p.r+=dt*.12*DPR,p.a-=dt*.0006,p.a>0));
  ripples.forEach(p=>{x.strokeStyle=`rgba(255,59,78,${p.a})`;x.lineWidth=2*DPR;x.beginPath();x.arc(cx,cy-IH*sc*.12,sc*IW*.3+p.r,0,6.283);x.stroke()});
  // red delantera
  net(cx,cy,sc*IW*.78,rot,true,act,t);
  // línea de escaneo suave
  const sy=(t/14*DPR)%H;x.fillStyle="rgba(0,255,156,.05)";x.fillRect(0,sy,W,2*DPR);
}
function net(cx,cy,R,rot,front,act,t){
  const cs=Math.cos(rot),sn=Math.sin(rot),P=nodes.map(n=>{const X=n[0]*cs-n[2]*sn,Z=n[0]*sn+n[2]*cs;return[cx+X*R*(1+px*.05),cy+n[1]*R*.95-Z*R*.12,Z,n[3]]});
  x.lineWidth=DPR;
  const inF=p=>front&&((p[0]-cx)/(R*.42))**2+((p[1]-cy+R*.1)/(R*.55))**2<1;
  for(const[i,j]of links){const a=P[i],b=P[j];if((a[2]+b[2]>0)!==front||inF(a)||inF(b))continue;const al=(front?.16:.16)+act*.1+level*.25;x.strokeStyle=`rgba(0,255,156,${al})`;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
  const np=Math.round(3+act*10+level*14);for(let k=0;k<np;k++){const e=links[(k*29+Math.floor(t/800)*7)%links.length],a=P[e[0]],b=P[e[1]];if((a[2]+b[2]>0)!==front)continue;const f=(t/650+k*.21)%1;x.fillStyle=k%4==0?"#ff3b4e":"#d9ffe9";x.fillRect(a[0]+(b[0]-a[0])*f-1.5*DPR,a[1]+(b[1]-a[1])*f-1.5*DPR,3*DPR,3*DPR)}
  for(const p of P){if((p[2]>0)!==front)continue;if(front&&((p[0]-cx)/(R*.42))**2+((p[1]-cy+R*.1)/(R*.55))**2<1)continue;const s=(front?2.6:1.6)*DPR;x.fillStyle=p[3]?"#ff3b4e":`rgba(0,255,156,${front?.95:.5})`;x.beginPath();x.arc(p[0],p[1],s,0,6.283);x.fill()}
}
requestAnimationFrame(frame);
{const q=new URLSearchParams(location.hash.slice(1));if(q.get("s"))setS(q.get("s"))}
</script></body></html>
