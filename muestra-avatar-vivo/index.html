<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020805"><title>Antares · Muestra avatar vivo v2</title>
<style>
@font-face{font-family:"Orbitron";src:url("../fonts/orbitron-latin.woff2") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Rajdhani";src:url("../fonts/rajdhani-600-latin.woff2") format("woff2");font-weight:600;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020805;color:#e4fff0;font-family:"Rajdhani",system-ui,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
h1{margin:0;font-family:"Orbitron",monospace;font-size:17px;letter-spacing:4px;text-shadow:0 0 10px #00ff9c}
.tag{font-family:"Orbitron",monospace;font-size:9px;letter-spacing:1.5px;color:#ff5a6e;border:1px solid rgba(255,59,78,.5);padding:3px 6px;border-radius:6px}
#st{font-family:"Orbitron",monospace;font-size:12px;letter-spacing:2px;color:#00ff9c;min-width:80px;text-align:right}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;height:100%;max-width:100%;aspect-ratio:640/720}
.glow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(0,255,156,.22),rgba(0,255,156,0) 65%);transition:opacity .5s,background .5s;opacity:.6}
body[data-s=speak] .glow{opacity:1}
body[data-s=listen] .glow{background:radial-gradient(circle,rgba(255,59,78,.2),rgba(255,59,78,0) 65%);opacity:1}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s ease;pointer-events:none}
video.on{opacity:1}
#net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.say{padding:4px 16px;min-height:46px;font-size:17px;text-align:center}
.row{display:flex;gap:6px;padding:4px 12px}
.row.last{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
button{flex:1;min-height:44px;font-family:"Orbitron",monospace;font-size:10px;letter-spacing:1px;color:#cfeedd;background:#05170e;border:1px solid rgba(0,255,156,.35);border-radius:10px}
button.on{background:#00ff9c;color:#02130a}
#tap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,8,5,.6);font-size:18px;z-index:5}
</style></head><body data-s="idle">
<div class="app">
<header><h1>ANTARES</h1><span class="tag">MUESTRA v2</span><span id="st">REPOSO</span></header>
<div class="stage"><div class="frame">
 <div class="glow"></div>
 <video id="v-idle" class="on" playsinline muted autoplay loop preload="auto"><source src="idle.mp4" type="video/mp4"><source src="idle.webm" type="video/webm"></video>
 <video id="v-speak" playsinline muted autoplay loop preload="auto"><source src="talk.mp4" type="video/mp4"><source src="talk.webm" type="video/webm"></video>
 <video id="v-listen" playsinline muted autoplay loop preload="auto"><source src="listen.mp4" type="video/mp4"><source src="listen.webm" type="video/webm"></video>
 <canvas id="net"></canvas>
 <div id="tap">Toque para iniciar</div>
</div></div>
<div class="say" id="say">Buenas tardes, Freddy. ¿En qué le puedo ayudar?</div>
<div class="row"><button data-s="idle" class="on">REPOSO</button><button data-s="listen">ESCUCHA</button><button data-s="speak">HABLA</button></div>
<div class="row last"><button id="tts">🔊 QUE HABLE</button><button id="mic">🎙 QUE ESCUCHE</button></div>
</div>
<script>
const SAY={idle:"Buenas tardes, Freddy. ¿En qué le puedo ayudar?",listen:"Le escucho…",speak:"Con gusto. Tiene tres recordatorios para hoy y el clima está despejado."};
const V={idle:document.getElementById("v-idle"),speak:document.getElementById("v-speak"),listen:document.getElementById("v-listen")};
let S="idle";
function setS(s){S=s;document.body.dataset.s=s;document.getElementById("st").textContent={idle:"REPOSO",listen:"ESCUCHA",speak:"HABLA"}[s];document.getElementById("say").textContent=SAY[s];
 for(const k in V){if(k===s){const v=V[k];if(v.paused)v.play().catch(()=>{});v.classList.add("on")}else V[k].classList.remove("on")}
 document.querySelectorAll("[data-s]").forEach(b=>b.dataset.s&&b.tagName==="BUTTON"&&b.classList.toggle("on",b.dataset.s===s))}
document.querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>setS(b.dataset.s));
// iOS en modo ahorro puede bloquear autoplay: un toque lo arranca
function kick(){Promise.all(Object.values(V).map(v=>v.play().catch(()=>{throw 0}))).then(()=>tap.style.display="none").catch(()=>tap.style.display="flex")}
const tap=document.getElementById("tap");tap.onclick=kick;setTimeout(kick,600);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)kick()});
document.getElementById("tts").onclick=()=>{kick();if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SAY.speak);u.lang="es-ES";u.onstart=()=>setS("speak");u.onend=u.onerror=()=>setS("idle");speechSynthesis.speak(u);setS("speak")};
let mic=null,an=null,buf=null,lvl=0;
document.getElementById("mic").onclick=async()=>{const b=document.getElementById("mic");kick();
 if(mic){mic.getTracks().forEach(t=>t.stop());mic=null;an=null;b.classList.remove("on");setS("idle");return}
 try{mic=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();an=ac.createAnalyser();an.fftSize=512;buf=new Uint8Array(512);ac.createMediaStreamSource(mic).connect(an);b.classList.add("on");setS("listen")}catch{setS("listen")}};
// red mínima en los bordes (pocos nodos, muy tenue)
const cv=document.getElementById("net"),x=cv.getContext("2d"),DPR=Math.min(2,devicePixelRatio||1),N=18,nodes=[...Array(N)].map((_,i)=>({a:i/N*6.283,r:.47+.04*Math.sin(i*2.3),s:.6+Math.random()*.6}));
function f(t){requestAnimationFrame(f);const r=cv.getBoundingClientRect(),W=r.width*DPR|0,H=r.height*DPR|0;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}x.clearRect(0,0,W,H);
 if(an){an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));lvl+=(m/50-lvl)*.3}else lvl*=.9;
 const cx=W/2,cy=H*.47,R=Math.min(W,H),act=S==="speak"?.55:S==="listen"?.45:.25,rot=t/1000*.05,P=nodes.map(n=>[cx+Math.cos(n.a+rot)*R*n.r,cy+Math.sin(n.a+rot)*R*n.r*1.05]);
 x.lineWidth=DPR;for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];x.strokeStyle=`rgba(0,255,156,${act*.35})`;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
 P.forEach((p,i)=>{x.fillStyle=i%5==0?`rgba(255,59,78,${act+.2})`:`rgba(0,255,156,${act+.2})`;x.beginPath();x.arc(p[0],p[1],1.8*DPR,0,6.283);x.fill()});
 if(S==="listen"){const k=(t%1600)/1600;x.strokeStyle=`rgba(255,59,78,${(1-k)*(.25+lvl*.5)})`;x.lineWidth=2*DPR;x.beginPath();x.ellipse(cx,cy,R*(.3+k*.2),R*(.33+k*.22),0,0,6.283);x.stroke()}}
requestAnimationFrame(f);
{const q=new URLSearchParams(location.hash.slice(1));if(q.get("s"))setS(q.get("s"))}
</script></body></html>
